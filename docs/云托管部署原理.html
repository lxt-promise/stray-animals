<svg viewBox="0 0 680 420" width="100%" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>云托管部署原理：zip 代码包到容器实例</title>
  <desc>zip 内只有代码与模型，Python 运行时由云端构建镜像时安装</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <text class="th" x="40" y="36">1. 上传的 zip（69MB，没有 Python）</text>
  <rect x="40" y="48" width="180" height="34" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <text class="ts" x="130" y="65" text-anchor="middle" dominant-baseline="central">app/ 业务代码</text>
  <rect x="232" y="48" width="150" height="34" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <text class="ts" x="307" y="65" text-anchor="middle" dominant-baseline="central">Dockerfile 菜谱</text>
  <rect x="394" y="48" width="150" height="34" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <text class="ts" x="469" y="65" text-anchor="middle" dominant-baseline="central">requirements.txt</text>
  <rect x="556" y="48" width="84" height="34" rx="8" fill="#FAC775" stroke="#854F0B" stroke-width="0.5"/>
  <text class="ts" x="598" y="65" text-anchor="middle" dominant-baseline="central">模型 91MB</text>

  <path class="arr" d="M340 92 L340 118" fill="none" marker-end="url(#arrow)"/>
  <text class="ts" x="352" y="110">云端按 Dockerfile 构建</text>

  <text class="th" x="40" y="140">2. 云端构建 Docker 镜像（运行时在这里装）</text>
  <rect x="40" y="152" width="600" height="130" rx="16" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
  <rect x="60" y="172" width="168" height="56" rx="8" fill="#D3D1C7" stroke="#5F5E5A" stroke-width="0.5"/>
  <text class="th" x="144" y="192" text-anchor="middle" dominant-baseline="central">基础层</text>
  <text class="ts" x="144" y="210" text-anchor="middle" dominant-baseline="central">python:3.11-slim</text>
  <rect x="248" y="172" width="168" height="56" rx="8" fill="#C0DD97" stroke="#3B6D11" stroke-width="0.5"/>
  <text class="th" x="332" y="192" text-anchor="middle" dominant-baseline="central">依赖层</text>
  <text class="ts" x="332" y="210" text-anchor="middle" dominant-baseline="central">pip install + ffmpeg</text>
  <rect x="436" y="172" width="184" height="56" rx="8" fill="#FAC775" stroke="#854F0B" stroke-width="0.5"/>
  <text class="th" x="528" y="192" text-anchor="middle" dominant-baseline="central">代码+模型层</text>
  <text class="ts" x="528" y="210" text-anchor="middle" dominant-baseline="central">COPY 进镜像</text>
  <text class="ts" x="340" y="256" text-anchor="middle" dominant-baseline="central">CMD: uvicorn 监听 ${PORT:-8000}  ·  ENV: REID_ONNX / INDEX_DB / API_TOKEN 由控制台注入</text>

  <path class="arr" d="M340 292 L340 318" fill="none" marker-end="url(#arrow)"/>
  <text class="ts" x="352" y="310">推送到镜像仓库，按版本拉起容器</text>

  <text class="th" x="40" y="340">3. 运行实例（可缩容到 0）</text>
  <rect x="40" y="352" width="180" height="48" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text class="th" x="130" y="370" text-anchor="middle" dominant-baseline="central">健康检查</text>
  <text class="ts" x="130" y="388" text-anchor="middle" dominant-baseline="central">定期探测监听端口</text>
  <rect x="250" y="352" width="180" height="48" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text class="th" x="340" y="370" text-anchor="middle" dominant-baseline="central">公网域名</text>
  <text class="ts" x="340" y="388" text-anchor="middle" dominant-baseline="central">流量转发到端口 80</text>
  <rect x="460" y="352" width="180" height="48" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text class="th" x="550" y="370" text-anchor="middle" dominant-baseline="central">数据卷 /data</text>
  <text class="ts" x="550" y="388" text-anchor="middle" dominant-baseline="central">特征库跨重启保留</text>
</svg>
