# /etc/nginx/conf.d/catcampus-vision.conf
# 微信小程序只允许访问 https + 已备案域名，所以这一层反代是必须的。
server {
    listen 443 ssl http2;
    server_name ai.yourdomain.com;

    ssl_certificate     /etc/letsencrypt/live/ai.yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ai.yourdomain.com/privkey.pem;

    client_max_body_size 32m;   # 兜底，实际素材走 URL 不在 body 里
    proxy_read_timeout   120s;  # GPU 冷启动 + 视频抽帧可能较久

    location / {
        proxy_pass         http://127.0.0.1:8000;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # 简易限流：单 IP 每秒 2 个请求，突发 5
        limit_req zone=vision burst=5 nodelay;
    }
}

# 在 http 块里加： limit_req_zone $binary_remote_addr zone=vision:10m rate=2r/s;
